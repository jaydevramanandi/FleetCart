<svg width="320" height="263" viewBox="0 0 320 263" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="320" height="263" fill="#f8f9fa"/>
  
  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="320" height="263" fill="url(#grid)"/>
  
  <!-- Center icon -->
  <g transform="translate(160, 131.5)" opacity="0.3">
    <circle cx="0" cy="0" r="30" fill="#1b263b"/>
    <rect x="-20" y="-15" width="40" height="25" rx="2" fill="#ffffff"/>
    <rect x="-15" y="-10" width="30" height="2" fill="#1b263b"/>
    <rect x="-15" y="-5" width="25" height="2" fill="#1b263b"/>
    <rect x="-15" y="0" width="20" height="2" fill="#1b263b"/>
    <rect x="-15" y="5" width="30" height="2" fill="#1b263b"/>
  </g>
  
  <!-- Corner decorations -->
  <circle cx="30" cy="30" r="8" fill="#ff4c4c" opacity="0.2"/>
  <circle cx="290" cy="30" r="8" fill="#ffcf5e" opacity="0.2"/>
  <circle cx="30" cy="233" r="8" fill="#ffcf5e" opacity="0.2"/>
  <circle cx="290" cy="233" r="8" fill="#ff4c4c" opacity="0.2"/>
</svg> 